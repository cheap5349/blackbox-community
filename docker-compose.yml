# 一键启动：MySQL + MinIO（对象存储）+ 黑盒社区 API（含前端静态托管）
# 使用：docker compose up -d --build
# 环境变量（可选覆盖）：MYSQL_ROOT_PASSWORD / DB_NAME / MINIO_ROOT_USER / MINIO_ROOT_PASSWORD / S3_BUCKET / JWT_SECRET
services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-heibox}
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-p${MYSQL_ROOT_PASSWORD:-rootpass}']
      interval: 5s
      timeout: 5s
      retries: 15

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # 管理控制台
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-please-change-me}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      DB_NAME: ${DB_NAME:-heibox}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-heibox}
      S3_REGION: us-east-1
      # 浏览器直连 MinIO 的公网地址（path-style：host:9000/桶名），生产请改为 CDN/域名
      S3_PUBLIC_URL: http://localhost:9000/${S3_BUCKET:-heibox}
    ports:
      - '3000:3000'
    volumes:
      - uploads_data:/app/server/uploads # 本地兜底模式的媒体目录（S3 模式基本不写入）

volumes:
  mysql_data:
  minio_data:
  uploads_data:
